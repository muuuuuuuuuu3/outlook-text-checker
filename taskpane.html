<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>誤字チェッカー</title>
  <!-- Office.jsを読み込む（Outlookアドインに必須） -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <!-- ボタンなどのスタイル -->
  <style>
    body {
      font-family: sans-serif;
      padding: 16px;
    }
    button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    #result {
      margin-top: 12px;
      white-space: pre-wrap; /* 改行をそのまま表示 */
    }
  </style>
</head>
<body>
  <h3>誤字チェッカー</h3>
  <!-- チェック実行ボタン -->
  <button onclick="checkText()">チェックする</button>
  <!-- 結果表示エリア -->
  <div id="result"></div>

  <!-- checker.jsとtaskpane.jsを読み込む -->
  <script src="checker.js"></script>
  <script src="taskpane.js"></script>
</body>
</html>
